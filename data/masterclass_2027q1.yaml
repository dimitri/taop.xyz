# Masterclass live session dates, Q1 2027.
#
# NOT part of the Black Friday sale — this block stays after the sale is
# deleted. Source: the Demio schedule agreed for Q1 2027; buyers still pick
# their own dates from the dashboard after checkout.
#
# All sessions run 17:00–20:00 Europe/Paris. The US equivalents are stored
# per session rather than per series because the clocks diverge mid-series:
# the US moves to DST on 2027-03-14 and Europe on 2027-03-28, so the five
# sessions in between are an hour later for US attendees.
#
# The page renders only sessions still in the future, evaluated at BUILD
# time — a rebuild is needed for a past date to drop off.

