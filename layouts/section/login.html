{{ partial "head.html" . }}
{{ partial "header.html" . }}

<style>
  .login-page {
    padding: 120px 20px 56px;
    text-align: center;
  }
  .login-page h1 {
    margin-bottom: 28px;
  }
  .login-form-wrap {
    max-width: 380px;
    margin: 0 auto;
  }
  .login-form-wrap input[type="email"] {
    color: #2e2241;
    background: #fff;
    border: 1.5px solid #c9bedd;
    border-radius: 4px;
    height: 46px;
    font-size: 15px;
    padding: 0 14px;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 12px;
    display: block;
    transition: border-color .15s;
  }
  .login-form-wrap input[type="email"]::placeholder {
    color: #b0a4c0;
    text-transform: none;
    letter-spacing: 0;
    opacity: 1;
  }
  .login-form-wrap input[type="email"]:focus {
    border-color: #67527a;
  }
  .login-form-wrap .button {
    width: 100%;
  }
  .login-note {
    margin-top: 14px;
    font-size: .85rem;
    color: #896da1;
    line-height: 1.5;
  }
  .login-divider {
    border: none;
    border-top: 1px solid #e4dced;
    margin: 22px 0;
    max-width: 380px;
    margin-left: auto;
    margin-right: auto;
  }
  .login-new-user {
    font-size: .9rem;
    color: #67527a;
  }
  .login-new-user a {
    color: #372649;
    font-weight: 700;
  }
  .login-new-user a:hover {
    color: #60b2d3;
  }
</style>

<div class="login-page">
  <i class="fa-solid fa-unlock" style="font-size:2rem;color:#896da1;margin-bottom:14px;display:block;"></i>
  <h1>Sign in</h1>

  <div class="login-form-wrap">
    <form method="get" action="https://api.theartofpostgresql.com/login">
      <input type="email" name="email" required placeholder="your@email.com" autocomplete="email">
      <button type="submit" class="button button_purple button_large">Send me a sign-in link</button>
    </form>

    <p class="login-note">We'll send a magic link — click it and you're in, no password needed.</p>

    <hr class="login-divider">

    <p class="login-new-user">
      New here? Enter your email above — your account is created automatically with free sample access.
      <a href="/app/">What's included →</a>
    </p>
  </div>
</div>

{{ partial "footer.html" . }}
