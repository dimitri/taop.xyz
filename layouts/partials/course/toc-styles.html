<style>
  /* ── Course TOC pages — reuses .cp-* visual language from book/contents ── */
  body.course-page .header {
    background: #2e2241 url('/images/demo/slide.jpg') center top no-repeat;
    background-size: cover;
    background-attachment: fixed;
  }

  /* Hero */
  .cp-hero {
    background: #2e2241 url('/images/demo/slide.jpg') center top no-repeat;
    background-size: cover;
    background-attachment: fixed;
    padding: 120px 0 64px;
    text-align: center;
  }
  .cp-hero-eyebrow { font:700 0.72rem/1 'Lato',sans-serif; color:#60b2d3; text-transform:uppercase; letter-spacing:0.12em; margin:0 0 16px; }
  .cp-hero h1 { font:300 2.6rem/1.2 'Lato',sans-serif; color:#fff; max-width:680px; margin:0 auto 16px; padding:0 24px; }
  .cp-hero .cp-hero-sub { font:300 1.05rem/1.6 'Lato',sans-serif; color:rgba(255,255,255,0.75); max-width:560px; margin:0 auto 36px; padding:0 24px; }
  .cp-stats-bar { display:flex; justify-content:center; gap:0; flex-wrap:wrap; max-width:680px; margin:0 auto; padding:0 24px; }
  .cp-stat { display:flex; flex-direction:column; align-items:center; padding:0 28px; border-right:1px solid rgba(255,255,255,0.2); }
  .cp-stat:last-child { border-right:none; }
  .cp-stat-n { font:700 2rem/1 'Lato',sans-serif; color:#60b2d3; letter-spacing:-0.02em; }
  .cp-stat-l { font:300 0.78rem/1.4 'Lato',sans-serif; color:rgba(255,255,255,0.65); text-transform:uppercase; letter-spacing:0.06em; margin-top:6px; white-space:nowrap; }

  /* Back + prev/next */
  .cp-course-nav { background:#f8f7f9; border-bottom:1px solid #e4dded; padding:14px 0; }
  .cp-course-nav-inner { max-width:1180px; margin:0 auto; padding:0 24px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .cp-course-nav a { font:300 0.82rem/1 'Lato',sans-serif; color:#60b2d3; text-decoration:none; }
  .cp-course-nav a:hover { text-decoration:underline; }
  .cp-course-nav-center { font:300 0.78rem/1 'Lato',sans-serif; color:#9e8fb0; }

  /* Module nav table */
  .cp-part-nav { background:#f8f7f9; padding:32px 0 36px; border-bottom:1px solid #e4dded; }
  .cp-part-nav-inner { max-width:860px; margin:0 auto; padding:0 24px; }
  .cp-part-nav-title { font:300 1.3rem/1.2 'Lato',sans-serif; color:#372649; margin:0 0 20px; }
  .cp-part-table { width:100%; border-collapse:collapse; }
  .cp-part-table thead tr { border-top:2px solid #67527a; border-bottom:1px solid #67527a; }
  .cp-part-table tbody tr:last-child { border-bottom:2px solid #67527a; }
  .cp-part-table tbody tr { border-bottom:1px solid #d5cde0; }
  .cp-part-table th { font:400 0.72rem/1 'Lato',sans-serif; color:#67527a; text-transform:uppercase; letter-spacing:0.08em; padding:8px 16px 8px 0; text-align:left; }
  .cp-part-table td { padding:9px 16px 9px 0; vertical-align:baseline; }
  .cp-part-table .col-part { width:80px; white-space:nowrap; font:400 0.82rem/1 'Lato',sans-serif; color:#60b2d3; vertical-align:top; padding-top:11px; }
  .cp-part-table .col-part a { font:inherit; color:inherit; text-decoration:none; display:block; }
  .cp-part-table .col-part .cp-tier-pill { display:block; margin-top:6px; }
  .cp-part-table .col-title { width:260px; }
  .cp-part-table .col-title a { font:700 0.92rem/1 'Lato',sans-serif; color:#372649; text-decoration:none; transition:color 0.15s; }
  .cp-part-table .col-part a:hover, .cp-part-table .col-title a:hover { color:#60b2d3; }
  .cp-part-table .col-hook { font:300 0.85rem/1.4 'Lato',sans-serif; color:#67527a; }

  /* Tier badges in nav */
  .cp-tier-pill { display:inline-block; font:700 0.6rem/1 'Lato',sans-serif; text-transform:uppercase; letter-spacing:0.08em; padding:2px 7px; border-radius:2px; vertical-align:middle; }
  .cp-tier-pill.core { background:rgba(96,178,211,0.12); color:#3a8aad; border:1px solid rgba(96,178,211,0.3); }
  .cp-tier-pill.advanced { background:rgba(139,111,176,0.1); color:#7050a8; border:1px solid rgba(139,111,176,0.28); }
  .cp-tier-pill.architect { background:rgba(180,83,9,0.1); color:#92420a; border:1px solid rgba(180,83,9,0.28); }

  /* Module sections */
  .cp-modules { }
  .cp-part { padding:72px 0 60px; border-bottom:1px solid #e4dded; }
  .cp-modules .cp-part:nth-child(odd) { background:#fff; }
  .cp-modules .cp-part:nth-child(even) { background:#f8f7f9; }
  .cp-part .wrapper { max-width:1180px; margin:0 auto; padding:0 24px; }

  /* Module heading */
  .cp-part-head { margin-bottom:20px; }
  .cp-part-badge { display:inline-flex; align-items:center; gap:8px; font:400 0.88rem/1 'Lato',sans-serif; color:#60b2d3; text-transform:uppercase; letter-spacing:0.1em; border:1px solid #60b2d3; border-radius:3px; padding:7px 16px; margin-bottom:16px; }
  /* Tier overrides on the badge */
  .cp-part.tier-advanced .cp-part-badge { color:#7050a8; border-color:#8b6fb0; }
  .cp-part.tier-architect .cp-part-badge { color:#92420a; border-color:#b45309; }
  .cp-part-head h2 { font:300 2rem/1.15 'Lato',sans-serif; color:#372649; margin:0 0 8px; }
  .cp-part-meta { font:300 0.85rem/1 'Lato',sans-serif; color:#67527a; }

  /* Part body: topics + showcase */
  .cp-part-body { display:grid; grid-template-columns:1fr 400px; gap:48px; align-items:start; }
  .cp-part-body > * { min-width:0; }

  /* Topic list */
  .cp-chapters { display:flex; flex-direction:column; gap:0; text-align:left; min-width:0; }
  .cp-chapter { display:flex; gap:14px; padding:14px 0; border-bottom:1px solid #ede8f2; align-items:baseline; min-width:0; }
  .cp-chapter > div { min-width:0; flex:1; }
  .cp-chapter:last-child { border-bottom:none; }
  .cp-ch-num { font:400 0.72rem/1 'Lato',sans-serif; color:#60b2d3; text-transform:uppercase; letter-spacing:0.04em; flex-shrink:0; width:42px; padding-top:3px; }
  .cp-part.tier-advanced .cp-ch-num { color:#8b6fb0; }
  .cp-part.tier-architect .cp-ch-num { color:#b45309; }
  .cp-ch-title { font:700 0.95rem/1.3 'Lato',sans-serif; color:#372649; }
  .cp-ch-topics { display:block; font:300 0.82rem/1.45 'Lato',sans-serif; color:#67527a; margin-top:3px; }

  /* Showcase panel */
  .cp-showcase { display:flex; flex-direction:column; gap:24px; position:sticky; top:24px; }
  .cp-query-card { background:#2a1f36; border-radius:8px; overflow:hidden; max-width:100%; min-width:0; }
  .cp-query-label { font:400 0.72rem/1 'Lato',sans-serif; color:#60b2d3; text-transform:uppercase; letter-spacing:0.08em; padding:14px 18px 10px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .cp-query-card pre { margin:0; padding:16px 18px; overflow-x:auto; background:transparent; border:none; border-radius:0; text-align:left; }
  .cp-query-card pre code { font:400 0.75rem/1.55 'Consolas','Monaco','Courier New',monospace; color:#c8b8e0; background:none; padding:0; }
  .cp-query-caption { font:300 0.8rem/1.55 'Lato',sans-serif; color:rgba(255,255,255,0.5); padding:10px 18px 14px; border-top:1px solid rgba(255,255,255,0.08); margin:0; }

  /* CTA */
  .cp-cta { background:#372649; padding:80px 0; text-align:center; }
  .cp-cta h2 { font:300 1.9rem/1.2 'Lato',sans-serif; color:#fff; margin:0 0 16px; }
  .cp-cta p { font:300 1rem/1.6 'Lato',sans-serif; color:rgba(255,255,255,0.65); max-width:540px; margin:0 auto 32px; }
  .cp-cta .cp-cta-btns { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
  .cp-cta .button.button_purple,.cp-cta .button.button_purple:visited { background:#60b2d3; border-color:#60b2d3; color:#fff; }
  .cp-cta .button.button_purple:hover { background:#4a9cbf; border-color:#4a9cbf; }

  /* Responsive */
  @media (max-width:960px) {
    .cp-part-body { grid-template-columns:1fr; }
    .cp-showcase { position:static; }
  }
  @media (max-width:640px) {
    .cp-hero { padding:80px 0 40px; }
    .cp-hero h1 { font-size:1.8rem; }
    .cp-stat { padding:0 16px; }
    .cp-stat-n { font-size:1.5rem; }
    .cp-part { padding:48px 0 40px; }
    .cp-cta { padding:56px 0; }
    .cp-cta h2 { font-size:1.4rem; }
  }

  /* ── Module description ── */
  .cp-part-desc { font:300 0.9rem/1.65 'Lato',sans-serif; color:#5a4a70; margin:10px auto 0; max-width:600px; text-align:left; }

  /* ── Per-module diagram ── */
  .cp-diagram { margin:0; max-width:100%; min-width:0; }
  .cp-diagram img { width:100%; max-width:100%; height:auto; display:block; border-radius:4px; }
  .cp-diagram figcaption { font:300 0.76rem/1.4 'Lato',sans-serif; color:#9e8fb0; text-align:center; margin-top:6px; }
</style>
