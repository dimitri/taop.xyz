<aside class="lesson_email_capture" aria-label="Get free access to the app">
  <div class="email_capture_copy">
    <strong>This lesson is from <em>The Art of PostgreSQL</em>.</strong>
    <p>Create a free account and connect to the app's dashboard — sample chapters, sample course modules, and the interactive book reader, free.</p>
  </div>
  <form class="email_capture_form" method="get" action="{{ if hugo.IsServer }}http://api.taop.localhost:8081{{ else }}https://api.theartofpostgresql.com{{ end }}/login">
    <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">
    <button type="submit">Get Free Access</button>
  </form>
</aside>
