<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 165"
     role="img" aria-label="f1db partial ERD: results references races by raceid but no FK is declared">
  <defs>
    <marker id="f1-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#ccc"/>
    </marker>
  </defs>

  <!-- races table -->
  <rect x="10" y="12" width="155" height="107" rx="3" fill="#f2f2f2" stroke="#aaa" stroke-width="1"/>
  <path d="M13,12 A3,3 0 0,0 10,15 L10,37 L165,37 L165,15 A3,3 0 0,0 162,12 Z" fill="#555"/>
  <text x="82" y="30" text-anchor="middle" fill="white" font-size="11" font-family="ui-sans-serif,sans-serif" font-weight="bold">races</text>
  <text x="20" y="55" fill="#333" font-size="10" font-family="ui-monospace,monospace">raceid</text>
  <text x="76" y="55" fill="#888" font-size="8.5" font-family="ui-sans-serif,sans-serif" font-style="italic"> PK</text>
  <text x="20" y="73" fill="#555" font-size="10" font-family="ui-monospace,monospace">year</text>
  <text x="20" y="91" fill="#555" font-size="10" font-family="ui-monospace,monospace">name</text>
  <text x="20" y="109" fill="#555" font-size="10" font-family="ui-monospace,monospace">date</text>

  <!-- results table -->
  <rect x="255" y="12" width="155" height="143" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M258,12 A3,3 0 0,0 255,15 L255,37 L410,37 L410,15 A3,3 0 0,0 407,12 Z" fill="#2563eb"/>
  <text x="332" y="30" text-anchor="middle" fill="white" font-size="11" font-family="ui-sans-serif,sans-serif" font-weight="bold">results</text>
  <text x="265" y="55" fill="#333" font-size="10" font-family="ui-monospace,monospace">resultid</text>
  <text x="328" y="55" fill="#888" font-size="8.5" font-family="ui-sans-serif,sans-serif" font-style="italic"> PK</text>
  <text x="265" y="73" fill="#555" font-size="10" font-family="ui-monospace,monospace">raceid</text>
  <text x="265" y="91" fill="#555" font-size="10" font-family="ui-monospace,monospace">driverid</text>
  <text x="265" y="109" fill="#555" font-size="10" font-family="ui-monospace,monospace">constructorid</text>
  <text x="265" y="127" fill="#555" font-size="10" font-family="ui-monospace,monospace">points</text>
  <text x="265" y="145" fill="#555" font-size="10" font-family="ui-monospace,monospace">statusid</text>

  <!-- Dashed logical link (no FK) -->
  <line x1="165" y1="55" x2="255" y2="73" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#f1-arr)"/>
  <text x="213" y="54" text-anchor="middle" fill="#aaa" font-size="9" font-family="ui-sans-serif,sans-serif" font-style="italic">no FK</text>
</svg>
