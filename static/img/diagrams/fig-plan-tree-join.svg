<svg viewBox="0 0 760 495" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="495" fill="#0f172a" rx="10"/>

  <!-- Caption -->
  <text x="380" y="22" text-anchor="middle" fill="#64748b" font-size="11">Data flows upward — each node reads rows from its children</text>

  <!-- ── Arrows (drawn first, underneath boxes) ── -->
  <!-- 1. Outer NL top (390,124) → Limit bottom (390,86) -->
  <line x1="390" y1="124" x2="390" y2="87" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- 2. Inner NL top (205,222) → Outer NL bottom (390,176) -->
  <line x1="205" y1="222" x2="390" y2="177" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- 3. IS drivers top (590,222) → Outer NL bottom (390,176) -->
  <line x1="590" y1="222" x2="390" y2="177" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- 4. Seq Scan top (100,324) → Inner NL bottom (205,274) -->
  <line x1="100" y1="324" x2="205" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- 5. Memoize top (310,324) → Inner NL bottom (205,274) -->
  <line x1="310" y1="324" x2="205" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- 6. IS races top (310,419) → Memoize bottom (310,376) -->
  <line x1="310" y1="419" x2="310" y2="377" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ── Node boxes ── -->

  <!-- Limit  cx=390 cy=60  rect(305,34,170,52) -->
  <rect x="305" y="34" width="170" height="52" rx="7" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="57" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="600">Limit</text>
  <text x="390" y="74" text-anchor="middle" fill="#8b5cf6" font-size="10">rows=20 · cost=0.56..69.61</text>

  <!-- Outer Nested Loop  cx=390 cy=150  rect(305,124,170,52) -->
  <rect x="305" y="124" width="170" height="52" rx="7" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="147" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">Nested Loop</text>
  <text x="390" y="164" text-anchor="middle" fill="#60a5fa" font-size="10">rows=484 · cost=0.56..1671</text>

  <!-- Inner Nested Loop  cx=205 cy=248  rect(120,222,170,52) -->
  <rect x="120" y="222" width="170" height="52" rx="7" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="205" y="245" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">Nested Loop</text>
  <text x="205" y="262" text-anchor="middle" fill="#60a5fa" font-size="10">rows=484 · cost=0.29..1527</text>

  <!-- Index Scan drivers  cx=590 cy=248  rect(505,222,170,52) -->
  <rect x="505" y="222" width="170" height="52" rx="7" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="590" y="245" text-anchor="middle" fill="#86efac" font-size="14" font-weight="600">Index Scan</text>
  <text x="590" y="262" text-anchor="middle" fill="#4ade80" font-size="10">drivers d · by driverid</text>

  <!-- Seq Scan results  cx=100 cy=350  rect(15,324,170,52) -->
  <rect x="15" y="324" width="170" height="52" rx="7" fill="#7c2d12" stroke="#f97316" stroke-width="1.5"/>
  <text x="100" y="347" text-anchor="middle" fill="#fed7aa" font-size="14" font-weight="600">Seq Scan</text>
  <text x="100" y="364" text-anchor="middle" fill="#fb923c" font-size="10">results res · 23,597 rows</text>

  <!-- Memoize  cx=310 cy=350  rect(225,324,170,52) -->
  <rect x="225" y="324" width="170" height="52" rx="7" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
  <text x="310" y="347" text-anchor="middle" fill="#e9d5ff" font-size="14" font-weight="600">Memoize</text>
  <text x="310" y="364" text-anchor="middle" fill="#c084fc" font-size="10">cache key: res.raceid</text>

  <!-- Index Scan races  cx=310 cy=445  rect(225,419,170,52) -->
  <rect x="225" y="419" width="170" height="52" rx="7" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="310" y="442" text-anchor="middle" fill="#86efac" font-size="14" font-weight="600">Index Scan</text>
  <text x="310" y="459" text-anchor="middle" fill="#4ade80" font-size="10">races r · filter year=2017</text>

  <!-- ── Legend ── -->
  <g transform="translate(18,478)" font-size="10" fill="#94a3b8">
    <rect x="0"   y="-9" width="11" height="11" rx="2" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
    <text x="15"  y="1">Flow control</text>
    <rect x="102" y="-9" width="11" height="11" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
    <text x="117" y="1">Join</text>
    <rect x="152" y="-9" width="11" height="11" rx="2" fill="#7c2d12" stroke="#f97316" stroke-width="1"/>
    <text x="167" y="1">Seq Scan</text>
    <rect x="235" y="-9" width="11" height="11" rx="2" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
    <text x="250" y="1">Index Scan</text>
    <rect x="320" y="-9" width="11" height="11" rx="2" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
    <text x="335" y="1">Memoize</text>
  </g>
</svg>
