<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 155"
     role="img" aria-label="Chinook partial ERD: invoice_line has declared foreign keys to track and invoice">
  <defs>
    <marker id="ck-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- track table -->
  <rect x="10" y="12" width="160" height="125" rx="3" fill="#f2f2f2" stroke="#aaa" stroke-width="1"/>
  <path d="M13,12 A3,3 0 0,0 10,15 L10,37 L170,37 L170,15 A3,3 0 0,0 167,12 Z" fill="#555"/>
  <text x="90" y="30" text-anchor="middle" fill="white" font-size="11" font-family="ui-sans-serif,sans-serif" font-weight="bold">track</text>
  <text x="20" y="55" fill="#333" font-size="10" font-family="ui-monospace,monospace">track_id</text>
  <text x="92" y="55" fill="#888" font-size="8.5" font-family="ui-sans-serif,sans-serif" font-style="italic"> PK</text>
  <text x="20" y="73" fill="#555" font-size="10" font-family="ui-monospace,monospace">name</text>
  <text x="20" y="91" fill="#bbb" font-size="10" font-family="ui-monospace,monospace">album_id</text>
  <text x="103" y="91" fill="#ccc" font-size="8.5" font-family="ui-sans-serif,sans-serif" font-style="italic"> FK</text>
  <text x="20" y="109" fill="#bbb" font-size="10" font-family="ui-monospace,monospace">genre_id</text>
  <text x="97" y="109" fill="#ccc" font-size="8.5" font-family="ui-sans-serif,sans-serif" font-style="italic"> FK</text>
  <text x="20" y="127" fill="#bbb" font-size="10" font-family="ui-monospace,monospace">unit_price</text>

  <!-- invoice_line table (center) -->
  <rect x="228" y="12" width="175" height="125" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <path d="M231,12 A3,3 0 0,0 228,15 L228,37 L403,37 L403,15 A3,3 0 0,0 400,12 Z" fill="#d97706"/>
  <text x="315" y="30" text-anchor="middle" fill="white" font-size="11" font-family="ui-sans-serif,sans-serif" font-weight="bold">invoice_line</text>
  <text x="238" y="55" fill="#333" font-size="10" font-family="ui-monospace,monospace">invoice_line_id</text>
  <text x="354" y="55" fill="#888" font-size="8.5" font-family="ui-sans-serif,sans-serif" font-style="italic"> PK</text>
  <text x="238" y="73" fill="#92400e" font-size="10" font-family="ui-monospace,monospace">invoice_id</text>
  <text x="319" y="73" fill="#d97706" font-size="8.5" font-family="ui-sans-serif,sans-serif" font-style="italic"> FK</text>
  <text x="238" y="91" fill="#92400e" font-size="10" font-family="ui-monospace,monospace">track_id</text>
  <text x="301" y="91" fill="#d97706" font-size="8.5" font-family="ui-sans-serif,sans-serif" font-style="italic"> FK</text>
  <text x="238" y="109" fill="#555" font-size="10" font-family="ui-monospace,monospace">unit_price</text>
  <text x="238" y="127" fill="#555" font-size="10" font-family="ui-monospace,monospace">quantity</text>

  <!-- invoice table -->
  <rect x="455" y="12" width="170" height="107" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <path d="M458,12 A3,3 0 0,0 455,15 L455,37 L625,37 L625,15 A3,3 0 0,0 622,12 Z" fill="#d97706"/>
  <text x="540" y="30" text-anchor="middle" fill="white" font-size="11" font-family="ui-sans-serif,sans-serif" font-weight="bold">invoice</text>
  <text x="465" y="55" fill="#333" font-size="10" font-family="ui-monospace,monospace">invoice_id</text>
  <text x="549" y="55" fill="#888" font-size="8.5" font-family="ui-sans-serif,sans-serif" font-style="italic"> PK</text>
  <text x="465" y="73" fill="#bbb" font-size="10" font-family="ui-monospace,monospace">customer_id</text>
  <text x="557" y="73" fill="#ccc" font-size="8.5" font-family="ui-sans-serif,sans-serif" font-style="italic"> FK</text>
  <text x="465" y="91" fill="#bbb" font-size="10" font-family="ui-monospace,monospace">invoice_date</text>
  <text x="465" y="109" fill="#bbb" font-size="10" font-family="ui-monospace,monospace">total</text>

  <!-- FK arrow: invoice_line.track_id → track.track_id -->
  <line x1="228" y1="91" x2="170" y2="55" stroke="#333" stroke-width="1.5" marker-end="url(#ck-arr)"/>
  <!-- FK arrow: invoice_line.invoice_id → invoice.invoice_id -->
  <line x1="403" y1="73" x2="455" y2="55" stroke="#333" stroke-width="1.5" marker-end="url(#ck-arr)"/>
</svg>
