<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <!-- Background -->
  <rect width="760" height="360" fill="#0f172a" rx="10"/>

  <!-- Title -->
  <text x="380" y="22" text-anchor="middle" fill="#64748b" font-size="11">Startup cost as share of total cost — gray = no output yet, color = emitting rows</text>

  <!-- X axis grid: 0%, 25%, 50%, 75%, 100% → x=152, 282, 412, 542, 672 -->
  <!-- bar area: x=152 to x=672 (520px = 100%) -->
  <g fill="#1e293b" stroke="none">
    <rect x="152" y="42" width="520" height="1"/>
    <rect x="282" y="42" width="1" height="260"/>
    <rect x="412" y="42" width="1" height="260"/>
    <rect x="542" y="42" width="1" height="260"/>
    <rect x="672" y="42" width="1" height="260"/>
  </g>
  <g fill="#334155" font-size="10" text-anchor="middle">
    <text x="152" y="37">0%</text>
    <text x="282" y="37">25%</text>
    <text x="412" y="37">50%</text>
    <text x="542" y="37">75%</text>
    <text x="672" y="37">100%</text>
  </g>
  <text x="412" y="318" text-anchor="middle" fill="#334155" font-size="10">fraction of total planner cost consumed before first row is emitted</text>

  <!-- ══ Row 1: Seq Scan results  (startup=0, 0%)  y=75 ══ -->
  <text x="147" y="79" text-anchor="end" fill="#94a3b8" font-size="12" font-weight="500">Seq Scan</text>
  <text x="147" y="94" text-anchor="end" fill="#64748b" font-size="10">startup = 0</text>
  <!-- output bar: full width 520px -->
  <rect x="152" y="62" width="520" height="28" rx="4" fill="#166534"/>
  <text x="412" y="80" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">startup = 0  →  first row emitted immediately</text>

  <!-- ══ Row 2: Hash Join  (startup=5.45%, 28px)  y=140 ══ -->
  <text x="147" y="144" text-anchor="end" fill="#94a3b8" font-size="12" font-weight="500">Hash Join</text>
  <text x="147" y="159" text-anchor="end" fill="#64748b" font-size="10">startup = 40.9</text>
  <!-- startup bar: 28px gray -->
  <rect x="152" y="127" width="28" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- output bar: 492px -->
  <rect x="180" y="127" width="492" height="28" rx="4" fill="#1e3a5f"/>
  <text x="440" y="145" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">5% startup (build hash table), then streams rows</text>

  <!-- divider between streaming and blocking -->
  <line x1="20" y1="183" x2="740" y2="183" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="380" y="196" text-anchor="middle" fill="#475569" font-size="10" font-style="italic">blocking nodes — must consume all input before emitting first row</text>

  <!-- ══ Row 3: HashAggregate  (startup=99.04%, 515px)  y=225 ══ -->
  <text x="147" y="229" text-anchor="end" fill="#94a3b8" font-size="12" font-weight="500">HashAggregate</text>
  <text x="147" y="244" text-anchor="end" fill="#64748b" font-size="10">startup = 869</text>
  <!-- startup bar: 512px gray -->
  <rect x="152" y="212" width="512" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="408" y="230" text-anchor="middle" fill="#64748b" font-size="11">startup = 869  —  aggregates all 23,597 input rows</text>
  <!-- output bar: min 8px -->
  <rect x="664" y="212" width="8" height="28" rx="2" fill="#92400e"/>
  <text x="676" y="230" fill="#fbbf24" font-size="10">840</text>

  <!-- ══ Row 4: Sort  (startup=99.77%, 519px)  y=295 ══ -->
  <text x="147" y="299" text-anchor="end" fill="#94a3b8" font-size="12" font-weight="500">Sort</text>
  <text x="147" y="314" text-anchor="end" fill="#64748b" font-size="10">startup = 895</text>
  <!-- startup bar: 512px gray -->
  <rect x="152" y="282" width="512" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="408" y="300" text-anchor="middle" fill="#64748b" font-size="11">startup = 895  —  sorts all 840 input rows</text>
  <!-- output bar: min 8px -->
  <rect x="664" y="282" width="8" height="28" rx="2" fill="#7f1d1d"/>
  <text x="676" y="300" fill="#fca5a5" font-size="10">840</text>

  <!-- ── Legend ── -->
  <g transform="translate(140,338)" font-size="10" fill="#94a3b8">
    <rect x="0" y="-8" width="14" height="10" rx="2" fill="#1e293b" stroke="#334155"/>
    <text x="18" y="0">startup phase (no output)</text>
    <rect x="175" y="-8" width="14" height="10" rx="2" fill="#166534"/>
    <text x="193" y="0">streaming output</text>
    <rect x="305" y="-8" width="14" height="10" rx="2" fill="#1e3a5f"/>
    <text x="323" y="0">join output</text>
    <rect x="400" y="-8" width="14" height="10" rx="2" fill="#92400e"/>
    <text x="418" y="0">blocking output</text>
  </g>
</svg>
